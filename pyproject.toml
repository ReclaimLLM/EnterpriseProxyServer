[project]
name = "dc-enterprise-proxy"
version = "0.1.0"
description = "ReclaimLLM enterprise LLM gateway proxy"
requires-python = ">=3.11"
dependencies = [
    "aioboto3>=13.0,<14",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "litellm==1.84.0",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pyyaml>=6,<7",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.26,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
